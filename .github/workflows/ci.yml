# Pull-request CI. Matrix follows STANDARDS-AND-COMPATIBILITY §5:
# PHP 8.1–8.5 × WP latest (with and without WooCommerce), WP 6.9 × PHP 8.1/8.5,
# multisite on the lowest and highest PHP, MySQL 8.0; WP nightly and PHP 8.6-dev allowed to fail.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-ceiling:
    name: Syntax ceiling (PHP 8.1 lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - run: bin/lint-syntax.sh

  legacy-parse:
    name: Requirements notice parses on PHP 7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.2'
          coverage: none
          tools: none
      # These two files run before the version check, so an outdated host must be able to parse them
      # to show the "requirements not met" notice instead of a fatal error.
      - run: php -l agentporter.php && php -l src/Core/Requirements.php

  phpcs:
    name: PHPCS (WPCS + VIP + PHPCompatibilityWP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr
      - name: Validate composer.json and lock freshness
        run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --no-progress
      - name: PHPCS
        run: vendor/bin/phpcs -q --report-full --report-checkstyle=./phpcs-report.xml
      - name: Annotate PR
        if: ${{ always() && hashFiles('phpcs-report.xml') != '' }}
        run: cs2pr ./phpcs-report.xml --graceful-warnings

  seeded-violations:
    name: Seeded violations fail the gates (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test:seeded

  tests:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.1–8.5 × WP latest, single site, no WooCommerce.
          - { php: '8.1', wp: latest }
          - { php: '8.2', wp: latest }
          - { php: '8.3', wp: latest }
          - { php: '8.4', wp: latest }
          - { php: '8.5', wp: latest }
          # WooCommerce latest × all PHP.
          - { php: '8.1', wp: latest, woo: latest }
          - { php: '8.2', wp: latest, woo: latest }
          - { php: '8.3', wp: latest, woo: latest }
          - { php: '8.4', wp: latest, woo: latest }
          - { php: '8.5', wp: latest, woo: latest }
          # Multisite on the lowest and highest PHP.
          - { php: '8.1', wp: latest, multisite: true }
          - { php: '8.5', wp: latest, multisite: true, woo: latest }
          # Minimum WordPress.
          - { php: '8.1', wp: '6.9' }
          - { php: '8.5', wp: '6.9' }
          # Allowed to fail.
          - { php: '8.5', wp: nightly, experimental: true }
          - { php: '8.6', wp: latest, experimental: true }
    uses: ./.github/workflows/_phpunit.yml
    with:
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
      woo: ${{ matrix.woo || '' }}
      multisite: ${{ matrix.multisite || false }}
      experimental: ${{ matrix.experimental || false }}
      db-image: mysql:8.0

  # Single required status check for branch protection.
  ci-result:
    name: CI result
    if: always()
    needs: [syntax-ceiling, legacy-parse, phpcs, seeded-violations, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c 'import json,sys; d=json.load(sys.stdin); bad={k:v["result"] for k,v in d.items() if v["result"]!="success"}; print("Failing:", bad) if bad else print("All required jobs passed"); sys.exit(1 if bad else 0)'
