# Pull-request CI. Matrix follows STANDARDS-AND-COMPATIBILITY §5:
# PHP 8.1–8.5 × WP latest (with and without WooCommerce), WP 6.9 × PHP 8.1/8.5,
# multisite on the lowest and highest PHP, MySQL 8.0; WP nightly and PHP 8.6-dev allowed to fail.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-ceiling:
    name: Syntax ceiling (PHP 8.1 lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - run: bin/lint-syntax.sh

  legacy-parse:
    name: Requirements notice on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      # These files run before the version check, so an outdated host must be able to parse and run
      # them to show the "requirements not met" notice instead of a fatal error.
      - run: php -l agentporter.php && php -l src/Core/Requirements.php && php -l tests/legacy/load-on-old-php.php
      - name: Load the plugin on unsupported PHP
        run: php tests/legacy/load-on-old-php.php

  phpcs:
    name: PHPCS (WPCS + VIP + PHPCompatibilityWP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr
      - name: Validate composer.json and lock freshness
        run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --no-progress
      - name: PHPCS
        run: vendor/bin/phpcs -q --report-full --report-checkstyle=./phpcs-report.xml
      - name: Pre-boot files are PHP 7.2-compatible (functions too, not only syntax)
        run: vendor/bin/phpcs -q --no-cache --standard=PHPCompatibilityWP --runtime-set testVersion 7.2- agentporter.php src/Core/Requirements.php tests/legacy/load-on-old-php.php
      - name: Annotate PR
        if: ${{ always() && hashFiles('phpcs-report.xml') != '' }}
        run: cs2pr ./phpcs-report.xml --graceful-warnings

  seeded-violations:
    name: Seeded violations fail the gates (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test:seeded

  tests:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.1–8.5 × WP latest, single site, no WooCommerce.
          - { php: '8.1', wp: latest }
          - { php: '8.2', wp: latest }
          - { php: '8.3', wp: latest }
          - { php: '8.4', wp: latest }
          - { php: '8.5', wp: latest }
          # WooCommerce latest × all PHP.
          - { php: '8.1', wp: latest, woo: latest }
          - { php: '8.2', wp: latest, woo: latest }
          - { php: '8.3', wp: latest, woo: latest }
          - { php: '8.4', wp: latest, woo: latest, extras: true }
          - { php: '8.5', wp: latest, woo: latest }
          # Multisite on the lowest and highest PHP.
          - { php: '8.1', wp: latest, multisite: true }
          - { php: '8.5', wp: latest, multisite: true, woo: latest }
          # Minimum WordPress.
          - { php: '8.1', wp: '6.9' }
          - { php: '8.5', wp: '6.9' }
          # Allowed to fail.
          - { php: '8.5', wp: nightly, experimental: true }
          - { php: '8.6', wp: latest, experimental: true }
    uses: ./.github/workflows/_phpunit.yml
    with:
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
      woo: ${{ matrix.woo || '' }}
      multisite: ${{ matrix.multisite || false }}
      experimental: ${{ matrix.experimental || false }}
      extras: ${{ matrix.extras || false }}
      db-image: mysql:8.0

  analyse:
    name: Static analysis (PHPStan, Psalm taint, Rector, Semgrep, readme)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --no-progress
      - run: composer install --working-dir=tools/psalm --no-interaction --no-progress
      - run: pip install semgrep==1.187.0
      - name: PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Psalm taint analysis
        run: composer analyse:psalm
      - name: Rector dry run
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: Semgrep
        run: composer semgrep
      - name: readme.txt
        run: composer readme:validate
      - name: composer audit
        run: composer audit --no-dev
      - name: Seeded violations fail each analyser
        run: bin/check-seeded-tools.sh phpstan psalm rector semgrep readme

  mutation:
    name: Mutation testing (Infection, Security/ MSI ≥ 80)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer install --working-dir=tools/infection --no-interaction --no-progress
      - name: Infection
        run: composer test:mutation
      - name: Seeded weak tests fail the MSI gate
        run: bin/check-seeded-tools.sh infection

  js:
    name: JavaScript (ESLint, Stylelint, Prettier, tsc, Jest, size-limit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + no-unsanitized, Stylelint, Prettier, tsc --noEmit)
        run: npm run lint
      - name: Jest (coverage thresholds)
        run: npm run test:unit
      - run: npm run build
      - name: Bundle size budgets
        run: npm run size
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Seeded violations fail each JS gate (incl. axe)
        run: npm run test:seeded

  e2e:
    name: E2E (Playwright + axe on wp-env)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-dev --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  plugin-check:
    name: Plugin Check (release build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2, wp-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - name: Build the release tree
        run: bin/build-dist.sh
      - name: Install WordPress and Plugin Check
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=latest
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --url=http://localhost --title=Check --admin_user=admin --admin_password=password --admin_email=admin@example.com --skip-email
          wp plugin install plugin-check --activate
          cp -r "$GITHUB_WORKSPACE/dist/agentporter" wp-content/plugins/agentporter
          wp plugin activate agentporter
          printf 'path: /tmp/wp\n' > "$RUNNER_TEMP/wp-cli.yml"
          echo "WP_CLI_CONFIG_PATH=$RUNNER_TEMP/wp-cli.yml" >> "$GITHUB_ENV"
      - name: Plugin Check (all checks, fail on errors)
        run: |
          wp plugin check agentporter --format=json | tee "$RUNNER_TEMP/plugin-check.txt"
          if grep -q '"type":"ERROR"' "$RUNNER_TEMP/plugin-check.txt"; then echo "Plugin Check reported errors"; exit 1; fi
      - name: Seeded violation fails Plugin Check
        env:
          PLUGIN_DIR: /tmp/wp/wp-content/plugins/agentporter
        run: bin/check-seeded-tools.sh plugin-check

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT: docker run --rm -v ${{ github.workspace }}:/repo -w /repo rhysd/actionlint:1.7.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: $ACTIONLINT -color
      - name: Seeded broken workflow fails actionlint
        run: bin/check-seeded-tools.sh actionlint

  # Single required status check for branch protection.
  ci-result:
    name: CI result
    if: always()
    needs: [syntax-ceiling, legacy-parse, phpcs, seeded-violations, tests, analyse, mutation, js, e2e, plugin-check, actionlint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c 'import json,sys; d=json.load(sys.stdin); bad={k:v["result"] for k,v in d.items() if v["result"]!="success"}; print("Failing:", bad) if bad else print("All required jobs passed"); sys.exit(1 if bad else 0)'
